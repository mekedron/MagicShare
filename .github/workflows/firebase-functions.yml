name: Firebase Functions CI

on:
  push:
    branches: [main]
    paths:
      - 'firebase/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase/firestore.indexes.json'
      - '.github/workflows/firebase-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firebase/functions/**'
      - 'firebase/firestore.rules'
      - 'firebase/firestore.indexes.json'
      - '.github/workflows/firebase-functions.yml'

env:
  NODE_VERSION: '20'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Setup JDK 21 (Firestore emulator runs on JVM; firebase-tools requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test
        run: npm test

      - name: Test (Cloud Functions, emulator)
        run: npm run test:functions

      - name: Test (Firestore rules)
        run: npm run test:rules

      - name: Build (tsc)
        run: npm run build
